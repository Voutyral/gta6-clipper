<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clips">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Clips prêts à poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Poppins XB"; src: url("fonts/Poppins-ExtraBold.ttf") format("truetype"); font-display: swap; }

  :root {
    --ink: #0d0b12;
    --ink-2: #16131d;
    --paper: #f3ede2;
    --paper-dim: #d9d1c3;
    --text-on-paper: #1a1620;
    --muted: #8a8296;
    --sun-1: #ff4f7b;
    --sun-2: #ff8a3d;
    --sun-3: #ffd23f;
    --sea: #19d3c5;
    --hook: #ffe600;
    --danger: #ff5a4e;
    --radius: 18px;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --body: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
    --display: "Anton", "Impact", "Arial Narrow", sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); }
  body {
    font-family: var(--body);
    min-height: 100vh;
    background:
      radial-gradient(120% 60% at 110% -10%, rgba(255, 79, 123, .28), transparent 60%),
      radial-gradient(90% 50% at -20% 10%, rgba(25, 211, 197, .16), transparent 60%),
      var(--ink);
    background-attachment: fixed;
  }
  /* Grain léger pour donner de la matière au fond. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  header {
    position: sticky; top: 0; z-index: 10;
    padding: calc(var(--safe-top) + 14px) 18px 12px;
    background: linear-gradient(to bottom, rgba(13, 11, 18, .96) 70%, rgba(13, 11, 18, 0));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .band { height: 5px; border-radius: 3px; margin-bottom: 14px;
    background: linear-gradient(90deg, var(--sun-1), var(--sun-2) 45%, var(--sun-3) 70%, var(--sea)); }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: .9; margin: 0;
    letter-spacing: .5px; text-transform: uppercase; }
  h1 em { font-style: normal; color: var(--hook); }
  .stamp { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; line-height: 1.35; }

  .tabs { display: flex; gap: 8px; margin-top: 14px; }
  .pick { flex: 0 0 auto; font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 10px 14px;
    border-radius: 999px; border: 1.5px solid var(--hook); background: transparent; color: var(--hook); }
  .pick[aria-pressed="true"] { background: var(--hook); color: var(--ink); }
  .tab { flex: 1; font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: .3px;
    padding: 10px 8px; border-radius: 999px; border: 1.5px solid #2c2736; background: transparent;
    color: var(--paper-dim); }
  .tab[aria-pressed="true"] { background: var(--paper); color: var(--text-on-paper); border-color: var(--paper); }
  .tab b { font-weight: 600; opacity: .65; }

  main { position: relative; z-index: 1; padding: 6px 14px calc(var(--safe-bottom) + 90px);
    max-width: 560px; margin: 0 auto; }

  /* ---------- Grille : une vignette par clip ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  /* ---------- Sections : une par campagne, puis « Autres clips » ---------- */
  .sec { margin: 24px 2px 0; }
  .sec:first-child { margin-top: 14px; }
  .sec h3 { margin: 0; display: flex; align-items: baseline; gap: 8px; font-family: var(--display); font-weight: 400;
    font-size: 25px; line-height: 1.05; text-transform: uppercase; letter-spacing: .3px; color: var(--paper); }
  .sec h3 b { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--hook); }
  .sec-sub { margin-top: 4px; font-family: var(--mono); font-size: 11px; line-height: 1.45; color: var(--muted); }
  .sec + .grid { margin-top: 10px; }
  .sec-empty { margin: 10px 2px 0; padding: 14px; border: 1.5px dashed #2c2736; border-radius: 12px;
    font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }
  .tile { position: relative; border-radius: 14px; overflow: hidden; background: var(--ink-2); aspect-ratio: 9 / 16;
    cursor: pointer; opacity: 0; transform: translateY(10px); animation: drop .45s cubic-bezier(.2, .8, .2, 1) forwards;
    box-shadow: 0 18px 34px -22px rgba(255, 79, 123, .55); user-select: none; -webkit-user-select: none; }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tile .shade { position: absolute; left: 0; right: 0; bottom: 0; padding: 46px 10px 10px;
    background: linear-gradient(to bottom, transparent, rgba(13, 11, 18, .78) 38%, rgba(13, 11, 18, .96)); }
  .tile .t-title { font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.02;
    text-transform: uppercase; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .tile .t-meta { font-family: var(--mono); font-size: 10.5px; color: var(--paper-dim); margin-top: 5px; letter-spacing: .2px; }
  .tile .score { top: 8px; right: 8px; font-size: 20px; padding: 5px 7px 3px; }
  .tile .score small { font-size: 11px; }
  .tile .check { position: absolute; top: 8px; left: 8px; width: 32px; height: 32px; border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, .9); background: rgba(13, 11, 18, .35); display: none;
    place-items: center; font-family: var(--mono); font-weight: 600; font-size: 15px; color: var(--ink); }
  .selecting .tile .check { display: grid; }
  .tile.sel { outline: 4px solid var(--hook); outline-offset: -4px; }
  .tile.sel .check { background: var(--hook); border-color: var(--hook); }
  .tile.posted img { filter: saturate(.2) brightness(.6); }
  .tile .done { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg); display: none;
    font-family: var(--display); font-size: 30px; color: var(--sea); border: 4px solid var(--sea); padding: 2px 10px 0;
    letter-spacing: 1px; background: rgba(13, 11, 18, .55); }
  .tile.posted .done { display: block; }

  /* ---------- Barre de sélection ---------- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 12px 14px calc(var(--safe-bottom) + 12px);
    background: rgba(13, 11, 18, .97); border-top: 1.5px solid #2c2736; transform: translateY(110%);
    transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .dock.show { transform: none; }
  .dock .row { display: flex; align-items: center; gap: 10px; max-width: 560px; margin: 0 auto; }
  .dock .info { flex: 1; font-family: var(--mono); font-size: 12.5px; color: var(--paper-dim); line-height: 1.35; }
  .dock .info b { color: var(--paper); font-size: 15px; }
  .dock .all { font-family: var(--mono); font-weight: 600; font-size: 12.5px; padding: 10px 12px; border-radius: 10px;
    border: 1.5px solid #3a3446; background: transparent; color: var(--paper); }
  .dock .go { position: relative; overflow: hidden; flex: 0 0 auto; min-width: 150px; min-height: 52px; border: none;
    border-radius: 12px; padding: 0 16px; font-family: var(--display); font-size: 21px; letter-spacing: .8px;
    text-transform: uppercase; color: var(--ink); background: linear-gradient(100deg, var(--sun-1), var(--sun-2) 60%, var(--sun-3)); }
  .dock .go:disabled { opacity: .45; }
  .dock .go.ready { background: var(--sea); }
  .dock .go .bar { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: var(--ink); transition: width .2s; }

  /* ---------- Fiche d'un clip (plein écran) ---------- */
  .sheet { position: fixed; inset: 0; z-index: 30; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--ink); padding: 0 14px calc(var(--safe-bottom) + 30px); }
  .sheet[hidden] { display: none; }
  .sheet .close { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end;
    padding: calc(var(--safe-top) + 10px) 0 6px; background: linear-gradient(to bottom, var(--ink) 75%, transparent); }
  .sheet .close button { font-family: var(--mono); font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 999px;
    border: 1.5px solid #3a3446; background: var(--ink-2); color: var(--paper); }
  .sheet .ticket { max-width: 560px; margin: 4px auto 0; }

  /* ---------- Ticket ---------- */
  .ticket { margin: 18px 0 30px; opacity: 0; transform: translateY(14px) rotate(-.4deg);
    animation: drop .5s cubic-bezier(.2, .8, .2, 1) forwards; }
  .ticket:nth-child(2n) { transform: translateY(14px) rotate(.4deg); }
  @keyframes drop { to { opacity: 1; transform: none; } }
  .ticket.posted { filter: saturate(.25) brightness(.8); }

  .screen { position: relative; border-radius: var(--radius) var(--radius) 0 0; overflow: hidden;
    background: #000; aspect-ratio: 9 / 16; max-height: 72vh; margin: 0 auto;
    box-shadow: 0 30px 60px -30px rgba(255, 79, 123, .45); }
  .screen video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .score { position: absolute; top: 12px; right: 12px; font-family: var(--display); font-size: 26px;
    line-height: 1; color: var(--ink); background: var(--hook); padding: 6px 9px 4px; border-radius: 6px;
    transform: rotate(4deg); box-shadow: 0 6px 0 rgba(0, 0, 0, .35); }
  .score small { font-size: 13px; }
  .postedmark { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; }
  .posted .postedmark { display: grid; }
  .postedmark span { font-family: var(--display); font-size: 64px; color: var(--sea); border: 6px solid var(--sea);
    padding: 4px 18px 0; transform: rotate(-12deg); letter-spacing: 2px; background: rgba(13, 11, 18, .55); }

  .paper { position: relative; background: var(--paper); color: var(--text-on-paper);
    border-radius: 0 0 var(--radius) var(--radius); padding: 22px 18px 18px; }
  /* Bord perforé entre l'écran et le ticket. */
  .paper::before { content: ""; position: absolute; left: 0; right: 0; top: -7px; height: 14px;
    background: radial-gradient(circle at 7px 7px, var(--ink) 5px, transparent 5.5px) 0 0 / 18px 14px repeat-x; }

  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-family: var(--mono); font-size: 11.5px;
    color: #5d5566; text-transform: uppercase; letter-spacing: .4px; }
  .meta .plat { color: #fff; background: #6441a5; padding: 1px 7px; border-radius: 4px; }
  .meta .plat.kick { background: #2b8a1f; }
  .title { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.02; margin: 10px 0 6px;
    text-transform: uppercase; word-break: break-word; }
  .what { font-size: 15px; line-height: 1.35; margin: 0 0 12px; color: #3d3645; }
  .credit { font-family: var(--mono); font-size: 12.5px; }
  .credit a { color: inherit; }
  .warn { margin: 10px 0 0; padding: 8px 10px; border: 1.5px dashed #c45a2c; border-radius: 8px;
    font-size: 13.5px; color: #8a3410; background: rgba(255, 138, 61, .1); }

  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
  .btn { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: .2px;
    border: 2px solid var(--text-on-paper); background: transparent; color: var(--text-on-paper);
    border-radius: 12px; padding: 12px 6px; min-height: 48px; cursor: pointer; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { grid-column: 1 / -1; font-family: var(--display); font-weight: 400; font-size: 24px;
    letter-spacing: 1px; text-transform: uppercase; border: none; color: var(--ink); min-height: 60px;
    background: linear-gradient(100deg, var(--sun-1), var(--sun-2) 60%, var(--sun-3));
    position: relative; overflow: hidden; }
  .btn.primary .bar { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: var(--ink);
    transition: width .2s; }
  .btn.primary.ready { background: var(--sea); }
  .btn.ghost { border-style: dashed; }
  .btn.on { background: var(--text-on-paper); color: var(--paper); }
  /* Retour visuel de la copie, sur le bouton touché lui même. */
  .btn.copied { background: var(--sea); border-color: var(--sea); color: var(--ink); animation: pop .3s ease-out; }
  .btn.failed { background: var(--danger); border-color: var(--danger); color: #fff; animation: pop .3s ease-out; }
  @keyframes pop { 40% { transform: scale(1.08); } }

  .empty { text-align: center; margin: 70px 8px; font-family: var(--mono); color: var(--muted); line-height: 1.6; }
  .empty strong { display: block; font-family: var(--display); font-weight: 400; font-size: 34px;
    color: var(--paper); letter-spacing: .5px; margin-bottom: 8px; text-transform: uppercase; }

  /* Au dessus de la fiche d'un clip (30), sinon les messages tapés depuis la fiche restent cachés derrière. */
  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px); z-index: 40;
    transform: translate(-50%, calc(100% + 60px)); transition: transform .25s cubic-bezier(.2, .8, .2, 1);
    background: var(--paper); color: var(--text-on-paper); font-family: var(--mono); font-weight: 600;
    font-size: 13px; padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    width: max-content; max-width: 92vw; pointer-events: none; }   /* ne bloque jamais un appui sur les boutons en dessous */
  .toast.show { transform: translate(-50%, 0); }
  .selecting .toast { bottom: calc(var(--safe-bottom) + 100px); }   /* au dessus de la barre de sélection */
  /* Fiche ouverte : le message passe en haut, sous « Fermer », pour ne pas cacher les boutons du bas. */
  .sheet-open .toast { bottom: auto; top: calc(var(--safe-top) + 64px); transform: translate(-50%, calc(-100% - 140px)); }
  .sheet-open .toast.show { transform: translate(-50%, 0); }
  .selecting main { padding-bottom: calc(var(--safe-bottom) + 120px); }

  @media (prefers-reduced-motion: reduce) { .ticket, .tile { animation: none; opacity: 1; transform: none; }
    .btn.copied, .btn.failed { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="band"></div>
  <div class="brand">
    <h1>Clips <em>prêts</em></h1>
    <div class="stamp" id="stamp">chargement…</div>
  </div>
  <div class="tabs" role="group" aria-label="Filtre">
    <button class="tab" id="tab-todo" aria-pressed="true">À poster <b id="n-todo">0</b></button>
    <button class="tab" id="tab-done" aria-pressed="false">Postés <b id="n-done">0</b></button>
    <button class="pick" id="langf" aria-pressed="false" hidden>FR + EN</button>
    <button class="pick" id="pick" aria-pressed="false">Choisir</button>
  </div>
</header>
<main id="list" aria-live="polite"></main>
<div class="dock" id="dock" aria-hidden="true">
  <div class="row">
    <div class="info" id="dock-info"><b>0 clip</b><br>touche les vignettes</div>
    <button class="all" id="dock-all" type="button">Tout</button>
    <button class="go" id="dock-go" type="button" disabled><span id="dock-label">Enregistrer</span><span class="bar" id="dock-bar"></span></button>
  </div>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const STORE = "clips-postes-v1";
  const MAX_PICK = 8;   // au delà, la mémoire du téléphone sature pendant le partage
  const list = document.getElementById("list");
  const toastEl = document.getElementById("toast");
  const sheet = document.getElementById("sheet");
  const dock = document.getElementById("dock");
  const $ = (id) => document.getElementById(id);
  let clips = [], view = "todo", data = {}, langView = "all";   // langView : all, fr ou en
  const langOf = (c) => (c.lang || "fr").toLowerCase();
  const langOk = (c) => langView === "all" || langOf(c) === langView;
  const inView = (c) => langOk(c) && (view === "done") === memory.has(c.file);
  let selecting = false, picked = [], batch = null;   // batch : vidéos chargées pour la sélection en cours
  const files = new Map();                              // vidéos déjà chargées, par nom de fichier

  // Mémoire « posté » propre à ce téléphone. Peut être indisponible (navigation privée) : on s'en passe.
  const memory = (() => {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) { saved = {}; }
    return {
      has: (k) => !!saved[k],
      toggle(k) {
        if (saved[k]) delete saved[k]; else saved[k] = Date.now();
        try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {}
        return !!saved[k];
      },
    };
  })();

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  // Copie le texte puis le confirme sur le bouton touché (vert « ✓ Copié » pendant 2 s) et par un message en bas.
  async function copy(text, btn, done, mark) {
    let ok = true;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      ta.remove();
    }
    const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
    clearTimeout(btn._reset);
    btn.classList.remove("copied", "failed");
    void btn.offsetWidth;   // relance l'animation si on touche deux fois de suite
    btn.classList.add(ok ? "copied" : "failed");
    btn.textContent = ok ? mark : "Raté";
    btn._reset = setTimeout(() => { btn.classList.remove("copied", "failed"); btn.textContent = label; }, 2000);
    toast(ok ? done : "Copie impossible, retouche le bouton");
  }

  function ago(iso) {
    const t = Date.parse(iso);
    if (!t) return "";
    const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 60) return `il y a ${m} min`;
    const h = Math.round(m / 60);
    return h < 48 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
  }

  function nextRun(schedule) {
    if (!schedule || !schedule.length) return "";
    const now = new Date();
    const times = [];
    for (const day of [0, 1]) {
      for (const hm of schedule) {
        const [h, m] = hm.split(":").map(Number);
        const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + day, h, m));
        if (d > now) times.push(d);
      }
    }
    times.sort((a, b) => a - b);
    return times.length ? times[0].toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
  }

  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v);
    }
    for (const k of kids) if (k !== null && k !== undefined) n.append(k);
    return n;
  }

  // Charge une vidéo dans le téléphone (une seule fois) et donne la progression de 0 à 1.
  async function loadFile(c, progress) {
    if (files.has(c.file)) { progress && progress(1); return files.get(c.file); }
    const res = await fetch(c.src);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const total = Number(res.headers.get("content-length")) || (c.size_mb || 0) * 1e6;
    const reader = res.body.getReader();
    const parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      if (progress && total) progress(Math.min(1, got / total));
    }
    const file = new File([new Blob(parts, { type: "video/mp4" })], c.file, { type: "video/mp4" });
    files.set(c.file, file);
    return file;
  }

  // Ouvre le partage d'iOS (« Enregistrer les vidéos », TikTok, YouTube…). Sinon, simple téléchargement.
  async function shareFiles(list, items) {
    if (navigator.canShare && navigator.canShare({ files: list })) {
      try { await navigator.share({ files: list }); return true; }
      catch (e) { if (e.name !== "AbortError") toast("Partage impossible : " + e.name); return false; }
    }
    for (const c of items) {
      const a = el("a", { href: c.src, download: c.file });
      document.body.appendChild(a); a.click(); a.remove();
    }
    toast(items.length > 1 ? "Téléchargements lancés" : "Téléchargement lancé");
    return true;
  }

  // Partage d'un clip : la vidéo est d'abord chargée (iOS exige un appui juste avant le partage).
  function shareButton(c) {
    const bar = el("span", { class: "bar" });
    const label = el("span", {}, files.has(c.file) ? "Partager ↗" : "Préparer la vidéo");
    const btn = el("button", { class: "btn primary" + (files.has(c.file) ? " ready" : ""), type: "button" }, label, bar);
    btn.addEventListener("click", async () => {
      if (files.has(c.file)) { await shareFiles([files.get(c.file)], [c]); return; }
      btn.disabled = true;
      try {
        await loadFile(c, (p) => { bar.style.width = Math.round(p * 100) + "%"; label.textContent = `Chargement ${Math.round(p * 100)} %`; });
        btn.classList.add("ready"); bar.style.width = "0";
        label.textContent = "Partager ↗";
      } catch (e) {
        label.textContent = "Réessayer";
        toast("Chargement impossible : " + e.message);
      } finally {
        btn.disabled = false;
      }
    });
    return btn;
  }

  const fmtDate = (t) => new Date(t).toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short",
                                                             hour: "2-digit", minute: "2-digit" });

  function campaignWhen(k) {
    const opens = Date.parse(k.opens), closes = Date.parse(k.closes);
    if (opens && Date.now() < opens) return `Pas avant ${fmtDate(opens)}.`;
    if (closes && Date.now() > closes) return "Campagne terminée.";
    if (closes) return `Jusqu'au ${fmtDate(closes)}.`;
    return "";
  }

  function campaignNote(c) {
    const k = c.campaign || {};
    const where = (k.platforms || []).join(" ou ") || "les plateformes de la campagne";
    const when = campaignWhen(k);
    const more = (k.reminders || []).length ? " À respecter : " + k.reminders.join(", ") + "." : "";
    return `💶 ${k.name || "Campagne"} : poste sur ${where}, active « contenu commercial », puis soumets `
      + `le lien sur Content Rewards dans les ${k.submit_minutes || 30} min.${when ? " " + when : ""}${more}`;
  }

  // Sections : une par campagne en cours (ordre de streamers.yaml), puis « Autres clips ».
  function sections(shown) {
    const known = data.campaigns || [];
    const groups = new Map(known.map((k) => [k.name, { name: k.name, camp: k, items: [] }]));
    const others = { name: "Autres clips", camp: null, items: [] };
    for (const c of shown) {
      const name = c.campaign && c.campaign.name;
      if (!name) { others.items.push(c); continue; }
      if (!groups.has(name)) groups.set(name, { name, camp: c.campaign, items: [] });
      groups.get(name).items.push(c);
    }
    return [...groups.values(), others];
  }

  function sectionHead(s) {
    const k = s.camp;
    const sub = k ? [(k.platforms || []).join(", "), campaignWhen(k)].filter(Boolean).join(" · ")
                  : "Chasse du moment, français et anglais, sans campagne";
    return el("div", { class: "sec" }, el("h3", {}, s.name, el("b", {}, String(s.items.length))),
      el("div", { class: "sec-sub" }, sub),
      k && (k.reminders || []).length ? el("div", { class: "sec-sub" }, "⚠ " + k.reminders.join(" · ")) : null);
  }

  function ticket(c, i) {
    const posted = memory.has(c.file);
    // Campagne : légende complète (titre, crédit exigé, hashtags). Sinon titre et hashtags seulement.
    const caption = c.caption || [c.title, (c.description || "").split("\n").filter((l) => l.startsWith("#")).join(" ")]
      .filter(Boolean).join("\n\n");
    // Titre YouTube préparé par la galerie (100 caractères max, « Paid partnership » en tête pour une campagne).
    const ytTitle = c.yt_title || (c.title || "").slice(0, 100);
    const card = el("article", { class: "ticket" + (posted ? " posted" : ""), style: `animation-delay:${Math.min(i, 6) * 70}ms` });
    const video = el("video", { src: c.src, poster: c.poster || undefined, controls: "", playsinline: "", preload: "none" });
    const screen = el("div", { class: "screen" }, video,
      c.ai_score != null ? el("div", { class: "score", title: "Note de l'IA" }, String(c.ai_score), el("small", {}, "/10")) : null,
      el("div", { class: "postedmark" }, el("span", {}, "POSTÉ")));
    const plat = (c.platform || "").toLowerCase();
    const meta = el("div", { class: "meta" },
      el("span", {}, langOf(c).toUpperCase()),
      plat ? el("span", { class: "plat " + plat }, plat) : null,
      c.views != null ? el("span", {}, `${Number(c.views).toLocaleString("fr-FR")} vues`) : null,
      el("span", {}, `${Math.round(c.duration || 0)} s`),
      el("span", {}, ago(c.made_at)));
    const credit = el("div", { class: "credit" }, "Source : ",
      c.source_url ? el("a", { href: c.source_url, target: "_blank", rel: "noopener" }, c.credit || "lien") : (c.credit || "?"));
    const warns = (c.notes || []).filter((n) => !/aucune parole/.test(n));
    const doneBtn = el("button", { class: "btn ghost" + (posted ? " on" : ""), type: "button" }, posted ? "✓ Posté" : "Posté ?");
    doneBtn.addEventListener("click", () => {
      const on = memory.toggle(c.file);
      card.classList.toggle("posted", on);
      doneBtn.classList.toggle("on", on);
      doneBtn.textContent = on ? "✓ Posté" : "Posté ?";
      count();
      toast(on ? "Rangé dans « Postés »" : "Remis dans « À poster »");
    });
    const paper = el("div", { class: "paper" }, meta,
      el("h2", { class: "title" }, c.title || "Sans titre"),
      c.what ? el("p", { class: "what" }, c.what) : null,
      credit,
      ...warns.map((w) => el("div", { class: "warn" }, "⚠ " + w)),
      c.campaign ? el("div", { class: "warn" }, campaignNote(c))
        : c.paid ? el("div", { class: "warn" }, "💶 Campagne rémunérée : coche « promotion payante » en publiant.") : null,
      el("div", { class: "actions" },
        shareButton(c),
        el("button", { class: "btn", type: "button",
                       onclick: (e) => copy(ytTitle, e.currentTarget, `Titre YouTube copié (${ytTitle.length}/100)`, "✓ Copié") },
           "Titre YT"),
        el("button", { class: "btn", type: "button",
                       onclick: (e) => copy(caption, e.currentTarget, "Légende copiée", "✓ Copiée") }, "Légende"),
        doneBtn));
    card.append(screen, paper);
    return card;
  }

  // ---------- Grille ----------
  function tile(c, i) {
    const posted = memory.has(c.file);
    const order = picked.indexOf(c.file);
    const meta = [langOf(c).toUpperCase(), (c.platform || "").toLowerCase(), `${Math.round(c.duration || 0)} s`,
                  ago(c.made_at)].filter(Boolean).join(" · ");
    const t = el("article", { class: "tile" + (posted ? " posted" : "") + (order >= 0 ? " sel" : ""),
                              style: `animation-delay:${Math.min(i, 8) * 45}ms`, role: "button",
                              "aria-label": (c.title || "Clip") + (order >= 0 ? " (choisi)" : "") },
      c.poster ? el("img", { src: c.poster, alt: "", loading: "lazy", decoding: "async" }) : null,
      c.ai_score != null ? el("div", { class: "score" }, String(c.ai_score), el("small", {}, "/10")) : null,
      el("div", { class: "check" }, order >= 0 ? String(order + 1) : ""),
      el("div", { class: "done" }, "POSTÉ"),
      el("div", { class: "shade" }, el("div", { class: "t-title" }, c.title || "Sans titre"), el("div", { class: "t-meta" }, meta)));
    t.addEventListener("click", () => (selecting ? togglePick(c) : openSheet(c)));
    return t;
  }

  function togglePick(c) {
    const k = picked.indexOf(c.file);
    if (k >= 0) picked.splice(k, 1);
    else if (picked.length >= MAX_PICK) { toast(`${MAX_PICK} clips maximum à la fois`); return; }
    else picked.push(c.file);
    batch = null;
    render();
  }

  function setSelecting(on) {
    selecting = on; picked = []; batch = null;
    $("pick").setAttribute("aria-pressed", on);
    $("pick").textContent = on ? "Annuler" : "Choisir";
    document.body.classList.toggle("selecting", on);
    render();
  }

  function updateDock() {
    dock.classList.toggle("show", selecting);
    dock.setAttribute("aria-hidden", !selecting);
    const items = clips.filter((c) => picked.includes(c.file));
    const mb = items.reduce((s, c) => s + (c.size_mb || 0), 0);
    $("dock-info").replaceChildren(el("b", {}, `${items.length} clip${items.length > 1 ? "s" : ""}`), el("br"),
      items.length ? `${Math.round(mb)} Mo` : "touche les vignettes");
    const go = $("dock-go");
    go.disabled = !items.length;
    go.classList.toggle("ready", !!batch);
    $("dock-label").textContent = batch ? (batch.shared ? "Marquer postés" : "Enregistrer ↗") : "Enregistrer";
    $("dock-bar").style.width = "0";
  }

  async function dockGo() {
    const items = picked.map((f) => clips.find((c) => c.file === f)).filter(Boolean);
    if (!items.length) return;
    const go = $("dock-go");
    if (batch && batch.shared) {           // après l'envoi : on range les clips dans « Postés »
      items.forEach((c) => { if (!memory.has(c.file)) memory.toggle(c.file); });
      toast(`${items.length} clip${items.length > 1 ? "s" : ""} rangé${items.length > 1 ? "s" : ""} dans « Postés »`);
      setSelecting(false);
      return;
    }
    if (batch) {                           // deuxième appui : la feuille de partage d'iOS
      if (await shareFiles(batch.files, items)) { batch.shared = true; updateDock(); }
      return;
    }
    go.disabled = true;                    // premier appui : chargement de toutes les vidéos
    const total = items.reduce((s, c) => s + (c.size_mb || 1), 0);
    let before = 0;
    try {
      const out = [];
      for (const [n, c] of items.entries()) {
        out.push(await loadFile(c, (p) => {
          const pct = Math.round((before + p * (c.size_mb || 1)) / total * 100);
          $("dock-bar").style.width = pct + "%";
          $("dock-label").textContent = `${n + 1}/${items.length} · ${pct} %`;
        }));
        before += c.size_mb || 1;
      }
      batch = { files: out, shared: false };
      toast("Prêt : touche « Enregistrer » puis « Enregistrer les vidéos »");
    } catch (e) {
      toast("Chargement impossible : " + e.message);
    } finally {
      go.disabled = false;
      updateDock();
    }
  }

  // ---------- Fiche plein écran ----------
  function openSheet(c) {
    const close = el("div", { class: "close" }, el("button", { type: "button", onclick: () => history.back() }, "✕ Fermer"));
    sheet.replaceChildren(close, ticket(c, 0));
    sheet.hidden = false; sheet.scrollTop = 0;
    document.body.style.overflow = "hidden";
    document.body.classList.add("sheet-open");
    history.pushState({ sheet: 1 }, "");
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.querySelectorAll("video").forEach((v) => v.pause());
    sheet.hidden = true; sheet.replaceChildren();
    document.body.style.overflow = "";
    document.body.classList.remove("sheet-open");
    render();
  }
  window.addEventListener("popstate", closeSheet);

  function count() {
    const pool = clips.filter(langOk);
    const done = pool.filter((c) => memory.has(c.file)).length;
    document.getElementById("n-todo").textContent = pool.length - done;
    document.getElementById("n-done").textContent = done;
  }

  function render() {
    list.replaceChildren();
    const shown = clips.filter(inView);
    count();
    updateDock();
    if (!shown.length && !(data.campaigns || []).length) {
      const next = nextRun(data.schedule_utc);
      list.append(el("div", { class: "empty" },
        el("strong", {}, view === "done" ? "Rien de posté" : "Tout est posté"),
        view === "done" ? "Les clips marqués « posté » arrivent ici." :
          (next ? `Prochaine chasse vers ${next}.` : "La prochaine chasse remplira la liste.")));
      return;
    }
    const secs = sections(shown);
    if (secs.length === 1) {   // aucune campagne : une seule grille, comme avant
      const grid = el("div", { class: "grid" });
      shown.forEach((c, i) => grid.append(tile(c, i)));
      list.append(grid);
      return;
    }
    let i = 0;
    for (const s of secs) {
      if (!s.camp && !s.items.length) continue;   // « Autres clips » vide : rien à montrer
      list.append(sectionHead(s));
      if (!s.items.length) {   // section de campagne vide : c'est la veille des lives qui lance la chasse
        list.append(el("div", { class: "sec-empty" }, view === "done" ? "Rien de posté ici."
          : "Pas encore de clip. La chasse part dès le début du live, puis toutes les heures."));
        continue;
      }
      const grid = el("div", { class: "grid" });
      s.items.forEach((c) => grid.append(tile(c, i++)));
      list.append(grid);
    }
  }

  $("pick").addEventListener("click", () => setSelecting(!selecting));
  $("langf").addEventListener("click", () => {
    langView = { all: "fr", fr: "en", en: "all" }[langView];
    $("langf").textContent = langView === "all" ? "FR + EN" : langView.toUpperCase();
    $("langf").setAttribute("aria-pressed", langView !== "all");
    picked = []; batch = null;
    render();
  });
  $("dock-go").addEventListener("click", dockGo);
  $("dock-all").addEventListener("click", () => {
    const shown = clips.filter(inView).map((c) => c.file);
    picked = picked.length >= Math.min(shown.length, MAX_PICK) ? [] : shown.slice(0, MAX_PICK);
    batch = null;
    if (shown.length > MAX_PICK) toast(`Les ${MAX_PICK} plus récents`);
    render();
  });

  for (const [id, v] of [["tab-todo", "todo"], ["tab-done", "done"]]) {
    document.getElementById(id).addEventListener("click", () => {
      view = v;
      document.getElementById("tab-todo").setAttribute("aria-pressed", v === "todo");
      document.getElementById("tab-done").setAttribute("aria-pressed", v === "done");
      picked = []; batch = null;
      render();
    });
  }

  fetch("clips.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((d) => {
      data = d || {};
      clips = data.clips || [];
      $("langf").hidden = new Set(clips.map(langOf)).size < 2;
      const next = nextRun(data.schedule_utc);
      document.getElementById("stamp").innerHTML = "";
      document.getElementById("stamp").append(
        "à jour " + (ago(data.generated_at) || "?"), document.createElement("br"),
        next ? "prochaine chasse " + next : "");
      render();
    })
    .catch(() => {
      document.getElementById("stamp").textContent = "hors ligne";
      list.append(el("div", { class: "empty" }, el("strong", {}, "Liste illisible"), "Recharge la page."));
    });
})();
</script>
</body>
</html>
