name: Diagnostic

# Bilan de santé en un bouton : Actions > Diagnostic > Run workflow.
# Vérifie Telegram, les clés d'IA, l'envoi YouTube et, si tu en donnes, des liens.
on:
  workflow_dispatch:
    inputs:
      links:
        description: "Liens à tester (optionnel)"
        required: false
        type: string

permissions:
  contents: write
  models: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUEST_TEXT: ${{ github.event.inputs.links }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Outils et dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default,curl-cffi]"

      - name: Bilan de santé
        run: python -m clipper doctor

      - name: Enregistrer l'état
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add -A state || true
          if ! git diff --cached --quiet; then
            git commit -q -m "État du clippeur"
            git pull -q --rebase
            git push -q
          fi
