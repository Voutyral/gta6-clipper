name: Clip

# Trois façons de lancer, toutes faisables au téléphone :
#  1. ouvrir une issue dont le titre contient le lien (le plus simple, app GitHub)
#  2. commenter une issue existante avec un nouveau lien
#  3. onglet Actions > Clip > Run workflow
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request:
        description: "Lien + options. Ex : https://www.twitch.tv/videos/123 1:02:30-1:03:10 @streamer"
        required: true
        type: string

permissions:
  contents: write   # lien de téléchargement, fiches et état
  issues: write     # réponse sur la demande
  models: read      # IA gratuite GitHub Models

concurrency:
  group: clip-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  clip:
    # Seul le propriétaire du dépôt peut lancer un clip par issue ou commentaire.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Le texte de la demande passe par une variable, jamais directement dans une commande.
      REQUEST_TEXT: ${{ github.event.inputs.request || github.event.comment.body || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Accusé de réception
        if: env.ISSUE_NUMBER != ''
        run: |
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/reactions" -f content=eyes >/dev/null || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Outils système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Dépendances Python
        run: |
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default,curl-cffi]"

      - name: Cache du modèle de sous-titres
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-v1

      - name: Clipper
        run: python -m clipper run --out out

      - name: Enregistrer l'état et les fiches
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add -A state || true
          git add -A knowledge || true
          if ! git diff --cached --quiet; then
            git commit -q -m "État du clippeur"
            git pull -q --rebase
            git push -q
          fi

      - name: Fermer la demande
        if: success() && github.event_name == 'issues'
        run: gh issue close "$ISSUE_NUMBER" >/dev/null || true
