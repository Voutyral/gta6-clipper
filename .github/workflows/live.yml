name: Veille des lives

# Un streamer en campagne (streamers.yaml) est-il en live ? La chasse de campagne part dès le début
# du live, puis toutes les heures pendant le live, puis toutes les heures pendant 6 heures après la fin
# (clips tardifs et rediffusion, où l'outil fait ses propres clips). Pendant la fenêtre du stream,
# une chasse part aussi au moins toutes les 2 heures, même si le live n'est pas vu.
#
# GitHub lance les tâches programmées de ce dépôt avec 8 à 14 heures de retard (compte récent).
# Autour du stream d'une campagne (de 24 h avant la fenêtre à 6 h après la fin du live), la veille
# tourne donc d'un seul tenant : un contrôle toutes les 5 minutes pendant 5 heures, puis elle se
# relance elle-même, sans attendre l'horaire. Pendant ce temps, elle lance aussi une chasse normale
# dès que la dernière date de plus de 2 heures. Elle démarre aussi quand ce fichier, clipper/live.py
# ou streamers.yaml change. En dehors de ces périodes : un seul contrôle par lancement.
on:
  # Pour mettre en pause : mettre en commentaire schedule et push (et l'horaire de chasse.yml).
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live.yml"
      - "clipper/live.py"
      - "streamers.yaml"

permissions:
  contents: write   # état de la veille (state/live.json)
  actions: write    # lancer la chasse, et relancer la veille

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.busy.outputs.skip }}
    steps:
      - name: Une veille tourne-t-elle déjà ?
        id: busy
        # Un lancement programmé (souvent très en retard) ne fait rien si une veille plus ancienne
        # tourne ou attend son tour : la veille continue s'en occupe déjà.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live.yml/runs?per_page=20" \
                --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }} and .status != \"completed\")] | length")
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Une veille tourne déjà : rien à faire." >> "$GITHUB_STEP_SUMMARY"
          fi

  watch:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: veille
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Outils (légers)
        run: pip install -q PyYAML requests "yt-dlp[default,curl-cffi]"

      - name: Veille
        id: veille
        run: |
          set +e
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          stop=$(( $(date +%s) + 300 * 60 ))   # 5 heures de veille par lancement, puis relance
          checks=0; hunts=0; regular=0; keep=""; sent=0
          # Heure de la dernière chasse normale (programmée, à la main ou lancée ici), annulées exclues.
          last_regular() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/chasse.yml/runs?per_page=15" --jq \
              '[.workflow_runs[] | select(.display_title != "Chasse de campagne")
                | select(.conclusion != "cancelled") | .created_at | fromdateiso8601] | max // 0' 2>/dev/null || echo 0
          }
          while :; do
            git pull -q --rebase --autostash   # dernière version du code et de streamers.yaml
            out=$(mktemp); sum=$(mktemp)
            GITHUB_OUTPUT="$out" GITHUB_STEP_SUMMARY="$sum" python -m clipper watch
            checks=$((checks + 1))
            if grep -qx "run=true" "$out"; then
              gh workflow run chasse.yml -f campaign_only=true && hunts=$((hunts + 1))
              cat "$sum" >> "$GITHUB_STEP_SUMMARY"
            fi
            git add state/live.json 2>/dev/null
            if ! git diff --cached --quiet; then
              git commit -q -m "Veille des lives"
              git pull -q --rebase && git push -q
            fi
            # Dernière réponse lisible : un contrôle qui plante ne coupe pas la veille.
            grep -qx "keep=true" "$out" && keep=true
            grep -qx "keep=false" "$out" && keep=false
            # Lancement de GTA 6 : GitHub retarde les chasses programmées de plusieurs heures. Tant que
            # la veille tourne d'un seul tenant, elle lance une chasse normale si la dernière date de
            # plus de 2 heures (la porte de chasse.yml évite les doublons avec les lancements en retard).
            # Garde-fous : jamais plus d'une chasse normale lancée ici toutes les 2 heures, et rien si
            # GitHub ne répond pas (heure inconnue).
            now=$(date +%s)
            if [ "$keep" = true ] && [ $(( now - sent )) -ge 7200 ]; then
              last=$(last_regular)
              if [ "${last:-0}" -gt 0 ] && [ $(( now - last )) -ge 7200 ]; then
                gh workflow run chasse.yml && regular=$((regular + 1)) && sent=$now
              fi
            fi
            [ "$keep" != false ] || break            # hors période de campagne : un seul contrôle
            [ "$(date +%s)" -lt "$stop" ] || break
            if grep -qx "watching=true" "$out"; then sleep 300; else sleep 900; fi
          done
          echo "keep=$keep" >> "$GITHUB_OUTPUT"
          printf '\nVeille : %s contrôle(s), %s chasse(s) de campagne et %s chasse(s) normale(s) lancée(s).\n' \
            "$checks" "$hunts" "$regular" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Relancer la veille
        if: always() && steps.veille.outputs.keep == 'true'
        run: |
          gh workflow run live.yml --ref "${{ github.ref_name }}"
          echo "Veille relancée pour les 5 heures suivantes." >> "$GITHUB_STEP_SUMMARY"
