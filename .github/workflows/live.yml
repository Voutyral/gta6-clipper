name: Veille des lives

# Toutes les 15 minutes : un streamer en campagne (streamers.yaml) vient-il de lancer son live ?
# Si oui, la chasse de campagne part tout de suite, puis toutes les heures pendant le live,
# puis encore toutes les heures pendant 6 heures après la fin (clips tardifs et rediffusion,
# où l'outil fait ses propres clips). GitHub peut retarder un lancement de quelques minutes.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # état de la veille (state/live.json)
  actions: write    # lancer le workflow de chasse

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Outils (légers)
        run: pip install -q PyYAML requests "yt-dlp[default,curl-cffi]"

      - name: Qui est en live ?
        id: watch
        run: python -m clipper watch

      - name: Lancer la chasse de campagne
        if: steps.watch.outputs.run == 'true'
        run: gh workflow run chasse.yml -f campaign_only=true

      - name: Enregistrer l'état
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/live.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Veille des lives"
            git pull -q --rebase
            git push -q
          fi
