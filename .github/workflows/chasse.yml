name: Chasseur de clips

# Toutes les 2 heures : clips les plus regardés du moment (Twitch, Kick, streamers suivis),
# montage des meilleurs, galerie mise à jour, et une issue pour te prévenir.
# Heures UTC : 01:17, 03:17… 23:17 (08:17, 10:17… au Laos). GitHub lance les tâches programmées
# de ce dépôt avec plusieurs heures de retard, mais leur rythme reste à peu près le même ; un
# lancement arrivé moins de 80 minutes après une autre chasse réussie ne fait rien.
# Les 19 et 20 novembre (stream GTA 6 de Dasgas Dom, campagne RUCKUS) : la veille des lives lance
# aussi des chasses réservées aux streamers en campagne, dès le début du live puis toutes les heures.
# Nom affiché du lancement : la porte d'entrée ci-dessous ne compte que les chasses normales.
run-name: ${{ github.event.inputs.campaign_only == 'true' && 'Chasse de campagne' || 'Chasseur de clips' }}

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "À blanc : lister ce qui serait monté, sans rien monter"
        type: boolean
        default: false
      max:
        description: "Nombre de clips à monter (vide : réglage de config.yaml)"
        type: string
        required: false
      campaign_only:
        description: "Uniquement les streamers en campagne (streamers.yaml)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  models: read
  pages: read

concurrency:
  group: chasse
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - name: Une chasse vient-elle de passer ?
        id: recent
        # Lancements programmés seulement (GitHub en livre parfois plusieurs d'un coup, en retard) :
        # rien à faire si une chasse normale a réussi il y a moins de 80 minutes. Les chasses de
        # campagne (veille des lives) ne comptent pas : le jour du stream, les deux tournent.
        # Les chasses lancées à la main ou par la veille partent toujours.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/chasse.yml/runs?status=success&per_page=8" \
                --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})
                       | select(.display_title != \"Chasse de campagne\")
                       | select((now - (.created_at | fromdateiso8601)) < 4800)] | length")
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Une chasse a déjà réussi il y a moins de 80 minutes : rien à faire." >> "$GITHUB_STEP_SUMMARY"
          fi

  hunt:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      MAX_CLIPS: ${{ github.event.inputs.max }}
      CAMPAIGN_ONLY: ${{ github.event.inputs.campaign_only == 'true' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Outils et dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default,curl-cffi]"

      - name: Cache des modèles de sous-titres
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/clipper
            ~/.cache/huggingface
          key: asr-parakeet-v3-whisper-small

      - name: Chasse
        run: |
          args=(--out out)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [[ "$MAX_CLIPS" =~ ^[0-9]+$ ]]; then args+=(--max "$MAX_CLIPS"); fi
          if [ "$CAMPAIGN_ONLY" = "true" ]; then args+=(--campaign-only); fi
          python -m clipper hunt "${args[@]}"

      - name: Enregistrer les clips déjà vus
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add -A state || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Chasse : clips vus"
            # Un autre envoi peut arriver pendant ce temps (le 19/11 à 18:14, la mémoire de la chasse
            # s'est perdue ainsi) : on recommence quelques fois avant d'abandonner.
            for i in 1 2 3 4 5; do
              if git pull -q --rebase && git push -q; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 4))
            done
            exit 1
          fi

  gallery:
    needs: hunt
    if: always() && needs.hunt.result == 'success' && github.event.inputs.dry_run != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/gallery.yml
