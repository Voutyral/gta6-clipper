name: Chasseur de clips

# Trois fois par jour : clips les plus regardés du moment (Twitch, Kick, streamers suivis),
# montage des meilleurs, galerie mise à jour, et une issue pour te prévenir.
# Heures UTC : 05:17, 11:17, 17:17 (12:17, 18:17, 00:17 au Laos ; 06:17, 12:17, 18:17 à Paris en hiver).
# GitHub retarde ou saute parfois un lancement programmé : deux créneaux de secours suivent
# chaque chasse, et ne font rien si une chasse programmée a réussi dans les 2 h 30 précédentes.
on:
  schedule:
    - cron: "17 5,11,17 * * *"
    - cron: "52 5,11,17 * * *"
    - cron: "37 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "À blanc : lister ce qui serait monté, sans rien monter"
        type: boolean
        default: false
      max:
        description: "Nombre de clips à monter (vide : réglage de config.yaml)"
        type: string
        required: false

permissions:
  contents: write
  issues: write
  models: read
  pages: read

concurrency:
  group: chasse
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - name: Une chasse programmée vient-elle de passer ?
        id: recent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/chasse.yml/runs?event=schedule&status=success&per_page=6" \
                --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})
                       | select((now - (.created_at | fromdateiso8601)) < 9000)] | length")
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Créneau de secours : une chasse a déjà réussi il y a moins de 2 h 30, rien à faire." >> "$GITHUB_STEP_SUMMARY"
          fi

  hunt:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      MAX_CLIPS: ${{ github.event.inputs.max }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Outils et dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default,curl-cffi]"

      - name: Cache des modèles de sous-titres
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/clipper
            ~/.cache/huggingface
          key: asr-parakeet-v3-whisper-small

      - name: Chasse
        run: |
          args=(--out out)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [[ "$MAX_CLIPS" =~ ^[0-9]+$ ]]; then args+=(--max "$MAX_CLIPS"); fi
          python -m clipper hunt "${args[@]}"

      - name: Enregistrer les clips déjà vus
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add -A state || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Chasse : clips vus"
            git pull -q --rebase
            git push -q
          fi

  gallery:
    needs: hunt
    if: always() && needs.hunt.result == 'success' && github.event.inputs.dry_run != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/gallery.yml
