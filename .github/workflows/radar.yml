name: Radar

# Une fois par jour : meilleurs clips Twitch des streamers de streamers.yaml marqués « auto: true ».
# Sans streamer marqué, le radar ne fait rien.
on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC, soit 05:17 à Paris en hiver
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Y a-t-il des streamers à suivre ?
        id: check
        run: |
          if grep -Eq '^[[:space:]]+auto:[[:space:]]*true' streamers.yaml; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun streamer avec auto: true. Rien à faire." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        if: steps.check.outputs.go == 'true'
        with:
          deno-version: v2.x

      - name: Outils et dépendances
        if: steps.check.outputs.go == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default,curl-cffi]"

      - name: Cache du modèle de sous-titres
        if: steps.check.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-v1

      - name: Radar
        if: steps.check.outputs.go == 'true'
        run: python -m clipper radar --out out

      - name: Enregistrer l'état
        if: always() && steps.check.outputs.go == 'true'
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add -A state || true
          if ! git diff --cached --quiet; then
            git commit -q -m "État du radar"
            git pull -q --rebase
            git push -q
          fi
