name: Galerie

# Page web des clips prêts à poster (GitHub Pages). Appelée après chaque clip et chaque chasse,
# et republiée d'elle-même quand la page, les campagnes ou les réglages de la galerie changent.
# Si Pages n'est pas activé sur le dépôt, rien n'est publié et le reste fonctionne normalement.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clipper/web/**"
      - "clipper/gallery.py"
      - "clipper/campaign.py"
      - "streamers.yaml"
      - "config.yaml"
      - ".github/workflows/gallery.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Pages est-il activé ?
        id: check
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Galerie inactive : active GitHub Pages (Settings > Pages > Source : GitHub Actions)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Toujours la dernière version de main : une chasse lancée avant une correction (clip caché,
      # réglage de la galerie) ne republie pas l'ancienne page en finissant.
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Construire la galerie
        if: steps.check.outputs.enabled == 'true'
        run: |
          pip install -q PyYAML requests
          python -m clipper gallery --out site

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
