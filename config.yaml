# Réglages du clippeur. Modifiable depuis le téléphone : ouvre ce fichier sur GitHub, icône crayon.
# Tout est optionnel : une ligne supprimée reprend sa valeur par défaut.

metadata:
  game: "GTA 6"
  language: auto                    # auto : titres, accroches et descriptions dans la langue parlée du clip
  languages: [fr, en]               # langues possibles (la première sert si on ne parle pas, ou une autre langue)
  hashtags: ["#GTA6", "#GTAVI", "#Shorts"]       # pour les clips envoyés à la main
  hashtags_by_game:                 # selon le jeu du clip trouvé par la chasse
    "Grand Theft Auto VI": ["#GTA6", "#GTAVI"]
    "Grand Theft Auto V": ["#GTA5", "#GTAV", "#GTARP"]
  hashtags_common: ["#Shorts"]
  fallback_hooks:                   # accroches utilisées seulement si aucune IA ne répond
    - "ATTENDS LA FIN"
    - "PERSONNE S'Y ATTENDAIT"
    - "IL A VRAIMENT FAIT ÇA"
    - "GTA 6 EST FOU"
  fallback_hooks_by_lang:           # les mêmes pour les clips anglais
    en: ["WAIT FOR IT", "NOBODY SAW THIS COMING", "HE REALLY DID THAT", "GTA 6 IS INSANE"]

detection:
  clips_per_video: 2                # clips tirés d'une longue vidéo (x3 dans la demande pour changer)
  extra_candidates: 2               # passages en plus soumis à l'IA pour qu'elle choisisse
  clip_min_s: 15
  clip_max_s: 45
  pre_peak_s: 12                    # secondes gardées avant le moment fort (la mise en place)
  post_peak_s: 14                   # secondes gardées après (la réaction)
  keep_whole_if_under_s: 61         # source plus courte : on la garde entière (clips Twitch)

fetch:
  max_height: 1080
  full_download_max_s: 900          # au-delà, on repère d'abord au son puis on télécharge par passages
  max_scan_s: 14400                 # durée maximale écoutée sur un long stream (4 h)

edit:
  layout: auto                      # auto | blur (jeu centré, fond flou) | crop (plein écran) | split (caméra en haut)
  auto_facecam: true                # l'IA repère la webcam du streamer : caméra en haut, jeu en bas
  jump_cuts: true                   # l'IA retire les temps morts à l'intérieur du clip (montage plus nerveux)
  jump_zoom: 1.07                   # léger zoom un morceau sur deux, pour marquer chaque coupe
  max_cuts: 10                      # coupes proposées par l'IA gardées au plus
  tighten: true                     # et en plus : silences raccourcis là où il ne se passe rien
  tighten_gap_s: 0.75               # silence entre deux phrases à partir duquel on raccourcit
  tighten_leave_s: 0.25             # souffle laissé à chaque coupe
  tighten_motion: 5.0               # au-delà, l'image bouge (action) : on ne coupe pas
  tighten_max: 8
  tighten_max_share: 0.25           # jamais plus d'un quart du clip retiré de cette façon
  min_after_cuts_s: 10              # jamais moins de 10 s une fois coupé
  min_keep_ratio: 0.55              # et jamais moins de 55 % du passage choisi
  zoom: 1.5                         # jeu sans webcam : 1.5 = jeu sur la moitié de l'écran, moins de flou
  teaser: auto                      # aperçu du moment fort en ouverture : auto | on | off
  teaser_s: 1.8
  punch: true                       # zoom et secousse brefs sur chaque impact
  punch_zoom: 1.12
  shake_px: 12
  max_punches: 3
  sfx: true                         # bruitages générés par le programme (whoosh, impact)
  sfx_gain_db: -9
  music: auto                       # joue une piste de assets/music si le dossier en contient
  music_gain_db: -21
  hook_seconds: 3.5
  voice_boost: true                 # voix compressée doucement : plus claire au téléphone
  credit_prefix: "Clip :"

captions:
  enabled: true
  engine: parakeet                  # parakeet (meilleur sur l'argot) | whisper (secours)
  ai_fix: true                      # Gemini réécoute le clip et corrige les mots (noms, argot)
  whisper_model: small              # tiny | base | small : utilisé si engine whisper ou en secours
  style: reveal                     # reveal (mots à venir estompés) | pop (mot courant coloré seulement)
  max_words: 3
  max_chars: 13
  highlight: "&H0000E5FF"           # jaune, au format ASS (bleu, vert, rouge)
  censor: true                      # gros mots masqués (« F****** ») : sous-titres, accroche, titre, description

ai:
  enabled: true
  gemini_models: [gemini-3-flash-preview, gemini-3.8-flash, gemini-2.5-flash]   # essayés dans l'ordre
  gemini_timeout_s: 120             # au-delà, on passe au modèle suivant
  github_models: [openai/gpt-4.1-mini, openai/gpt-4o-mini, openai/gpt-4.1, openai/gpt-4o]
  claude_model: claude-haiku-5-5
  gemini_thinking: low              # low : réponse rapide ; default : réflexion longue

delivery:
  release: true                     # lien de téléchargement sur GitHub
  keep_days: 7                      # les clips plus vieux sont supprimés de GitHub

youtube:
  mode: off                         # off | private | public (il faut aussi les 3 secrets YT_*, voir README)
  category_id: "20"                 # 20 = jeux vidéo

hunt:                               # le chasseur : trouve tout seul les clips du moment
  enabled: true
  max_per_run: 6                    # clips montés par passage (un passage toutes les 2 heures)
  max_per_day: 60                   # plafond du jour hors campagne (les clips de campagne passent toujours)
  campaign_max_per_run: 8           # quand une campagne de streamers.yaml a des clips à monter
  max_candidates: 16                # clips essayés au maximum par passage (les refus sont écartés avant montage)
  mix_languages: true               # alterne français et anglais (sinon l'anglais, plus vu, prend tout)
  min_ai_score: 4                   # note minimale (sur 10) : n'écarte que ce qui ne montre pas le jeu ou ne se comprend pas
  game_boost:                       # jeux à privilégier : leur score est multiplié
    "Grand Theft Auto VI": 3
  min_views: 150                    # vues voulues sur le clip d'origine
  min_views_floor: 40               # les jours calmes, la chasse descend jusque là (ces clips passent après)
  max_age_hours: 30
  min_duration_s: 8
  max_duration_s: 120
  max_per_streamer_day: 2           # pour varier les streamers
  allowlist_only: false             # true : uniquement les streamers de streamers.yaml
  allowlist_boost: 2.0              # priorité donnée aux streamers de streamers.yaml
  blocked_streamers: []             # pseudos à ne jamais prendre
  exclude_words: [spoiler, ending, "fin du jeu", "final mission", "dernière mission", cinématique, cinematic, cutscene]
  require_languages: [fr, en]       # langues parlées acceptées (vérifiées à la transcription pour Kick)
  twitch:
    enabled: true
    games: ["Grand Theft Auto VI", "Grand Theft Auto V"]
    languages: [fr, en]             # une recherche par langue ; retire en pour revenir au français seul
    per_game: 50                    # clips lus par jeu et par langue
  kick:
    enabled: true
    categories: [grand-theft-auto-vi, grand-theft-auto-v]

gallery:
  days: 7                           # clips gardés dans la galerie (les releases durent 7 jours)
  max_clips: 60
  max_mb: 900                       # GitHub Pages refuse plus de 1 Go : les plus anciens restent dehors
  hide:                             # clips à ne jamais montrer (nom du fichier, sans .mp4)
    - 20261118-030954-suryanshexd-00   # stream en hindi, sans GTA à l'image
    - 20261119-072802-dasgasd3m-40     # Dom : jeu de zombies sous la catégorie GTA VI (refusé par la campagne)
    - 20261119-184808-dasgasd3m-40     # même clip, refait le 20/11
  schedule_utc: ["01:17", "03:17", "05:17", "07:17", "09:17", "11:17", "13:17", "15:17", "17:17", "19:17", "21:17", "23:17"]   # comme la ligne cron de chasse.yml
