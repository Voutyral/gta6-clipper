# Streamers que tu as le droit de clipper : campagne rejointe (Content Rewards, Discord du streamer) ou accord écrit.
# Le radar automatique ne touche qu'à cette liste. Un clip d'une source absente d'ici
# est quand même monté, mais marqué « accord à vérifier ».
#
# Exemple à copier (retire les # et adapte) :
#
# streamers:
#   - name: ExempleStreamer
#     twitch: exemplestreamer          # pseudo Twitch, sert au radar (ou kick: pseudo Kick)
#     credit: "@exemplestreamer"       # affiché sur le clip et dans la description
#     auto: true                       # true : le radar prend ses meilleurs clips chaque jour
#     paid: true                       # campagne rémunérée : pense à « promotion payante » en publiant
#     min_views: 500
#     layout: split                    # caméra en haut, jeu en bas
#     facecam: {x: 0.0, y: 0.72, w: 0.24, h: 0.28}   # position de sa caméra, en fractions de l'image
#
# Une campagne s'ajoute avec un bloc `campaign:` (voir Dasgas Dom ci-dessous) : la chasse ne prend
# alors que la source autorisée, avant tout le reste, et le montage suit le brief.

streamers:
  - name: Dasgas Dom
    kick: dasgasd3m                    # chaîne Kick suivie par la chasse
    credit: "dasgasd3m on Kick"        # crédit exigé à l'écran, lisible sur un téléphone
    credit_prefix: "Paid partnership ·"   # → « Paid partnership · dasgasd3m on Kick » en bas de tout le clip
    disclosure: "Paid partnership"     # en tête de la légende, là où on le voit (exigé)
    cta: "WATCH DOM LIVE ON KICK.COM/DASGASD3M"   # fin du clip : renvoyer vers son stream
    language: en                       # Dom parle anglais : sous-titres, accroche, titre et légende en anglais
    auto: true
    paid: true
    min_views: 1                       # tous les clips de son stream comptent, les plus vus d'abord
    max_per_day: 12                    # pas de limite à 2 clips par jour pour lui
    story_ok: true                     # moments d'histoire voulus : alerte spoiler, rien de dévoilé
    music: off                         # son clair : pas de musique ajoutée
    sfx: off                           # « ne couvre pas sa meilleure réplique avec un bruitage »
    teaser: off                        # mise en place, pause, chute : rien de dévoilé en ouverture
    strict_risks: [musique]            # chanson sous licence bien audible : refusée (hors de sa permission)
    detection: {clip_min_s: 20, clip_max_s: 60}   # format conseillé : 20 à 60 secondes
    hashtags: ["#ad", "#dasgasdom3", "#GTA6", "#GTAVI"]
    caption_lines:                     # ajouté à la légende : crédit et lien exigés par la campagne
      - "🎥 Dasgas Dom live on Kick: kick.com/dasgasd3m"
    fallback_hooks: ["DASGAS DOM IN GTA 6", "WAIT FOR IT", "DOM WAS NOT READY"]
    campaign:
      name: "Dom GTA 6 (RUCKUS)"
      platforms: [TikTok, YouTube Shorts]          # Instagram ne compte pas pour cette campagne
      opens: "2026-11-19T09:00:00-08:00"           # publier et soumettre seulement après (minuit au Laos)
      closes: "2026-12-19T23:59:00-08:00"          # date limite de soumission
      footage_from: "2026-11-19T00:00:00-05:00"    # seul le stream GTA 6 du 19 novembre est autorisé
      footage_until: "2026-11-20T00:00:00-08:00"
      same_stream: true                            # un live commencé le 19 reste valable après minuit
      games: ["Grand Theft Auto VI"]
      submit_minutes: 30                           # lien soumis moins de 30 min après la publication
      vod_clips: 6                                 # clips que l'outil tire lui-même de la rediffusion
      # 1 $ les 1 000 vues, payé seulement à partir de 10 000 vues sur un même post, 100 $ max par post,
      # budget total 1 000 $. Deux posts ne s'additionnent pas.
      reminders: ["« Paid partnership » bien visible et réglage contenu commercial activé",
                  "payé seulement à partir de 10 000 vues sur un même post", "un post = une seule campagne"]
      brief: |
        Streamer: Dasgas Dom (Kick: dasgasd3m), American, speaks English, makes adult jokes.
        Goal: bring new viewers to his Kick channel with clips of his GTA 6 launch-day stream.
        Clip funny, emotional and unexpected GTA 6 moments from his stream: story reactions (a character's
        death, a betrayal, a major story moment: show the scene and his reaction), glitches, crashes,
        missed jumps or failed missions, his jokes, impressions and comments during gameplay (keep the setup
        and his delivery), a funny question or comment from chat and his answer (the real exchange),
        unexpected NPC interactions or game details that get a strong reaction from him.
        The moment: keep the setup, his real reaction and the payoff together. His face (webcam) or voice
        must stay in the edit. Hook: a reason to keep watching in the first 2 seconds.
        Length: 20 to 60 seconds.
        Comedy: keep the setup, the pause and the punchline. Emotion: give the moment room to breathe,
        do not rush to the next cut. Cuts must never change what he said or meant: never cut an answer
        to say the opposite, never cut the pause before a punchline.
        Title: start with "Dasgas Dom" and use the campaign formats only when the footage really shows it:
        "Dasgas Dom finds a GTA 6 glitch", "Dasgas Dom fails [mission]", "Dasgas Dom reacts to [scene]".
        For a story moment, never name who dies or what happens (e.g. "Dasgas Dom reacts to a huge GTA 6 story moment").
        On-screen hook: 6 words max, same spirit (e.g. "DOM FINDS A GTA 6 GLITCH").
        Never invent a reaction, a chat message or gameplay. Never present other footage as his.
        Adult jokes: only moments suitable for TikTok and YouTube; if the joke cannot work without
        explicit material, give a low score. A copyrighted song clearly audible (game radio): risk "musique".
